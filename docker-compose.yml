services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/app/storage
      - models:/app/model_cache
volumes:
  pgdata:
  storage:
  models:
